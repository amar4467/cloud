<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Air Quality Index (AQI)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 450px;
      margin: 40px auto;
      padding: 0 15px;
    }
    input {
      width: 100%;
      padding: 7px;
      margin: 8px 0;
      box-sizing: border-box;
    }
    button {
      padding: 7px 15px;
      cursor: pointer;
    }
    .result {
      border: 1px solid #000;
      padding: 15px;
      margin-top: 20px;
    }
    #error {
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h2>Air Quality Index (AQI) Checker</h2>

  <form id="aqiForm">
    <label for="city">Enter City Name:</label>
    <input type="text" id="city" placeholder="e.g. Delhi, Beijing, New York" required>
    <button type="submit">Check AQI</button>
  </form>

  <p id="error"></p>

  <div id="result" class="result" style="display: none;">
    <h3>Air Quality Report</h3>
    <p><b>Location:</b> <span id="loc"></span></p>
    <p><b>AQI (US Index):</b> <span id="aqiVal"></span></p>
    <p><b>Category:</b> <span id="catVal"></span></p>
    <p><b>PM 2.5:</b> <span id="pm25Val"></span> µg/m³</p>
    <p><b>PM 10:</b> <span id="pm10Val"></span> µg/m³</p>
    <p><b>Carbon Monoxide:</b> <span id="coVal"></span> µg/m³</p>
  </div>

  <script>
    const form = document.getElementById('aqiForm');
    const resultDiv = document.getElementById('result');
    const errorText = document.getElementById('error');

    form.onsubmit = async (e) => {
      e.preventDefault();
      const city = document.getElementById('city').value.trim();
      errorText.textContent = '';
      resultDiv.style.display = 'none';

      try {
        const res = await fetch(`/api/aqi?city=${encodeURIComponent(city)}`);
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Failed to get AQI data');
        }

        document.getElementById('loc').textContent = `${data.city}, ${data.country}`;
        document.getElementById('aqiVal').textContent = data.aqi;
        document.getElementById('catVal').textContent = data.category;
        document.getElementById('pm25Val').textContent = data.pm2_5;
        document.getElementById('pm10Val').textContent = data.pm10;
        document.getElementById('coVal').textContent = data.carbon_monoxide;
        resultDiv.style.display = 'block';
      } catch (err) {
        errorText.textContent = err.message;
      }
    };
  </script>
</body>
</html>
